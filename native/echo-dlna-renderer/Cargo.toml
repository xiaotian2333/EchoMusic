[package]
name = "echo-dlna-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "EchoMusic DLNA MediaRenderer 接收端（SSDP + SOAP，基于 vendored dlna-dmr）"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi9", "tokio_rt"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
log = { version = "0.4", features = ["std"] }
dlna-dmr = { path = "vendor/dlna-dmr" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
quick-xml = { version = "0.37", features = ["serialize"] }
echo-native-log = { path = "../echo-native-log" }

[build-dependencies]
napi-build = "2"
