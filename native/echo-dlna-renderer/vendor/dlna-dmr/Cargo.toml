# Vendored from https://github.com/PRO-2684/dlna-dmr (v0.1.3, MIT License)。
# 本地补丁（相对上游）：
# 1. `ssdp` 模块改为 pub，供 echo-dlna-renderer 自组运行循环（替换 ctrl_c 退出方式）
# 2. NOTIFY alive 的 LOCATION 修正为 HTTP 端口（上游误用 SSDP 端口 1900）
# 3. M-SEARCH 应答按请求的 ST 精确匹配（上游一律回 rootdevice）
# 4. M-SEARCH 应答 LOCATION 路径与 NOTIFY 统一为 /description.xml（上游为 /DeviceSpec）
# 5. 修复 SeekUnit Display 实现中 TRACK_NR / REL_TIME 的互换错误
# 6. 移除依赖测试夹具的 tests 模块与仅适用于独立二进制的 [profile.release]
# 7. M-SEARCH 应答与 alive/byebye 宣告补设备类型 ST（MediaRenderer:1/2），
#    否则仅按设备类型搜索的控制点发现不了设备
[package]
name = "dlna-dmr"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
description = "An extensible DLNA DMR (Digital Media Renderer) implementation"
keywords = ["DLNA", "DMR", "DigitalMediaRenderer", "upnp"]
categories = ["multimedia", "security", "simulation", "web-programming"]
repository = "https://github.com/PRO-2684/dlna-dmr"
license = "MIT"
authors = ["PRO-2684"]

[dependencies]
axum = { version = "0.8.4", default-features = false, features = ["http1", "tokio", "tower-log", "tracing"] }
chrono = { version = "0.4.41", default-features = false, features = ["alloc", "std", "clock", "now"] }
env_logger = { version = "0.11.8", optional = true }
local-ip-address = "0.6.5"
log = "0.4.27"
quick-xml = { version = "0.37.5", features = ["serialize"] }
serde = { version = "1.0.219", features = ["derive"] }
socket2 = "0.5.10"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
toml = { version = "0.8.22", optional = true, default-features = false, features = ["parse"] }
uuid = { version = "1.17.0", features = ["v4"] }

[[bin]]
name = "dlna-dmr"
required-features = ["cli"]

[features]
cli = ["env_logger", "toml"]
ctrlc = []
